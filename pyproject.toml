[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-cleaner-local"
version = "0.2.0"
description = "Conservative, transparent macOS storage analysis"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mac-cleaner = "mac_cleaner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
