[package]
name = "mac-cleaner-local"
version = "0.2.0"
description = "Conservative macOS storage analysis and confirmed cleanup UI"
authors = ["mac-cleaner contributors"]
edition = "2021"

[lib]
name = "mac_cleaner_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
